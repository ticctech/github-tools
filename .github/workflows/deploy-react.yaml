# Deploys the specified docker image as a Container App.

# https://docs.github.com/en/enterprise-cloud@latest/actions/using-workflows/reusing-workflows

name: Build and deploy static web app

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: string
        description: |
          The environment to deploy to.
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      # The three inputs below are optional. Left empty, the workflow behaves as before:
      # it builds the calling ref with `npm run build-<environment>` and the .env files.
      # ticctech/portal's "Deploy Preview" uses them to put a feature branch on a preview slot.
      ref:
        required: false
        type: string
        default: ''
        description: Branch, tag or SHA to build instead of the calling ref.
      build_script:
        required: false
        type: string
        default: ''
        description: npm script to build with. Defaults to build-<environment>.
      app_host:
        required: false
        type: string
        default: ''
        description: Overrides VITE_APP_HOST for this build (Vite gives existing env vars priority over .env files).
      # tag:
      #   type: string
      #   description: |
      #     GitHub tag to use to select image to deploy. Expected in format 'v1.2.3', 
      #     e.g. 'v0.5.0-beta.1'. If nothing is specified, the latest release tag will be used.

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Generate version
        id: version
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DRY_RUN: true
          PRERELEASE: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}
          DEFAULT_BUMP: patch
          MAJOR_STRING_TOKEN: "MAJOR"
          MINOR_STRING_TOKEN: "MINOR"
          PATCH_STRING_TOKEN: "PATCH"

      - name: npm config
        env:
          BUF_NPM_TOKEN: ${{ secrets.BUF_NPM_TOKEN }}
          # GitHub Packages (@ticctech scope, e.g. @ticctech/ory). The calling
          # repo's GITHUB_TOKEN needs read access to the package (grant via the
          # package's "Manage Actions access" settings). Inert for apps whose
          # .npmrc doesn't map a scope to npm.pkg.github.com.
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//buf.build/gen/npm/v1/:_authToken=$BUF_NPM_TOKEN" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=$GH_PACKAGES_TOKEN" >> .npmrc

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          BUILD_SCRIPT: ${{ inputs.build_script || format('build-{0}', inputs.environment) }}
          APP_HOST: ${{ inputs.app_host }}
        run: |
          if [ -n "$APP_HOST" ]; then export VITE_APP_HOST="$APP_HOST"; fi
          npm run "$BUILD_SCRIPT"

      - name: Deploy
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true

      - name: Summary
        if: ${{ inputs.ref != '' }}
        env:
          REF: ${{ inputs.ref }}
          APP_HOST: ${{ inputs.app_host }}
          ENV_NAME: ${{ inputs.environment }}
        run: |
          echo "### Deployed \`$REF\` ($(git rev-parse --short HEAD)) to $ENV_NAME" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$APP_HOST" ]; then echo "$APP_HOST" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Tag repo
        # only apply tag for development environment
        if: ${{ inputs.environment  == 'development'}}
        uses: actions/github-script@v8
        with:
          script: |
            const tagName = "${{ steps.version.outputs.new_tag }}";
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`
              });
              core.info(`Tag ${tagName} already exists at this SHA, skipping`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`,
                sha: context.sha
              });
              core.info(`Created tag ${tagName}`);
            }

      - name: Create GitHub Release
        # Only create releases for production deployments
        if: ${{ inputs.environment == 'staging' }}
        uses: actions/github-script@v8
        with:
          script: |
            const tagName = "${{ steps.version.outputs.new_tag }}";
            
            // Check if tag already exists, create only if it doesn't
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`
              });
              console.log(`Tag ${tagName} already exists, skipping tag creation`);
            } catch (error) {
              if (error.status === 404) {
                // Tag doesn't exist, create it
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${tagName}`,
                  sha: context.sha
                });
                console.log(`Created tag ${tagName}`);
              } else {
                throw error;
              }
            }
            
            // Create release (this will use existing tag if present)
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: tagName,
              body: "Production release " + tagName,
              draft: false,
              prerelease: false
            })
